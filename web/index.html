<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>codex-session-sync</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d1a;--surface:#161628;--surface2:#1e1e35;--border:#2a2a45;
  --text:#e8e8f0;--text2:#9090b0;--accent:#5b8dee;--accent2:#7c5cbf;
  --green:#3ecf8e;--red:#e94560;--yellow:#f5a623;--blue:#5b8dee;
  --radius:8px;--shadow:0 2px 12px rgba(0,0,0,.4);
}
html,body{height:100%;background:var(--bg);color:var(--text);font:14px/1.5 'Segoe UI',system-ui,sans-serif}
a{color:var(--accent);text-decoration:none}
button{cursor:pointer;border:none;border-radius:var(--radius);font:inherit;transition:opacity .15s,background .15s}
button:hover{opacity:.85}
button:disabled{opacity:.45;cursor:not-allowed}
.btn{padding:7px 16px;background:var(--accent);color:#fff;font-size:13px}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text2)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);opacity:1}
.btn-danger{background:var(--red)}
.btn-success{background:var(--green);color:#0d0d1a}
input,select,textarea{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);
  color:var(--text);font:inherit;padding:7px 10px;width:100%;outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
label{display:block;margin-bottom:4px;font-size:12px;color:var(--text2)}
/* layout */
#app{display:flex;flex-direction:column;height:100vh}
#nav{display:flex;align-items:center;gap:0;background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;flex-shrink:0}
#nav .brand{font-weight:700;font-size:15px;margin-right:24px;color:var(--text);letter-spacing:.3px}
.nav-tab{padding:14px 16px;color:var(--text2);font-size:13px;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.nav-tab:hover{color:var(--text)}
.nav-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
#main{flex:1;overflow:auto;padding:24px}
/* cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card-title{font-size:13px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px}
/* grid */
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
/* stat tiles */
.stat-val{font-size:32px;font-weight:700;color:var(--text)}
.stat-lbl{font-size:12px;color:var(--text2);margin-top:4px}
/* badge */
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.badge-green{background:rgba(62,207,142,.15);color:var(--green)}
.badge-red{background:rgba(233,69,96,.15);color:var(--red)}
.badge-yellow{background:rgba(245,166,35,.15);color:var(--yellow)}
.badge-blue{background:rgba(91,141,238,.15);color:var(--blue)}
/* dot status */
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.dot-green{background:var(--green)}
.dot-red{background:var(--red)}
.dot-yellow{background:var(--yellow);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
/* spinner */
.spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
/* table */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;padding:8px 12px;border-bottom:1px solid var(--border)}
td{padding:9px 12px;border-bottom:1px solid rgba(42,42,69,.5);font-size:13px;vertical-align:middle}
tr:hover td{background:var(--surface2)}
/* sidebar layout */
.sidebar-layout{display:flex;gap:16px;height:calc(100vh - 120px)}
.sidebar{width:220px;flex-shrink:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:auto}
.sidebar-item{padding:10px 14px;cursor:pointer;font-size:13px;color:var(--text2);border-left:3px solid transparent;transition:all .1s}
.sidebar-item:hover{background:var(--surface2);color:var(--text)}
.sidebar-item.active{color:var(--accent);border-left-color:var(--accent);background:rgba(91,141,238,.07)}
.sidebar-section{padding:8px 14px 4px;font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.7px}
.content-pane{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:auto;padding:16px}
/* progress bar */
.progress-wrap{background:var(--surface2);border-radius:20px;height:6px;overflow:hidden;margin:8px 0}
.progress-bar{height:100%;background:var(--accent);border-radius:20px;transition:width .3s}
/* log stream */
.log-stream{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:12px;height:200px;overflow:auto;font:12px/1.6 'Consolas','Fira Mono',monospace;color:var(--text2)}
.log-stream .err{color:var(--red)}
.log-stream .ok{color:var(--green)}
.log-stream .info{color:var(--text2)}
/* toast */
#toast-container{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:8px;z-index:9999}
.toast{padding:12px 18px;border-radius:var(--radius);font-size:13px;box-shadow:var(--shadow);animation:slideIn .2s ease;max-width:340px}
.toast-success{background:#1a3a2e;border:1px solid var(--green);color:var(--green)}
.toast-error{background:#3a1a20;border:1px solid var(--red);color:var(--red)}
.toast-info{background:var(--surface2);border:1px solid var(--border);color:var(--text)}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
/* misc */
.flex{display:flex}.gap-8{gap:8px}.gap-12{gap:12px}.gap-16{gap:16px}
.items-center{align-items:center}.justify-between{justify-content:space-between}
.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}.mt-24{margin-top:24px}
.mb-8{margin-bottom:8px}.mb-16{margin-bottom:16px}
.text-sm{font-size:12px}.text-muted{color:var(--text2)}
.flex-1{flex:1}.w-full{width:100%}
.hidden{display:none!important}
#loading-overlay{position:fixed;inset:0;background:rgba(13,13,26,.7);display:flex;align-items:center;justify-content:center;z-index:8888;backdrop-filter:blur(2px)}
</style>
</head>
<body>
<div id="app">
  <nav id="nav">
    <span class="brand">⚡ cxsync</span>
    <span class="nav-tab" data-route="/">Dashboard</span>
    <span class="nav-tab" data-route="/sessions">会话管理</span>
    <span class="nav-tab" data-route="/sync">同步</span>
    <span class="nav-tab" data-route="/backup">备份恢复</span>
  </nav>
  <main id="main"></main>
</div>
<div id="toast-container"></div>
<script>
// ── Toast ──────────────────────────────────────────────────────────────────
function toast(msg, type='info', ms=3500) {
  const c = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(() => el.remove(), ms);
}

// ── API helpers ────────────────────────────────────────────────────────────
async function api(method, path, body) {
  const opts = { method, headers: {'Content-Type':'application/json'} };
  if (body !== undefined) opts.body = JSON.stringify(body);
  const r = await fetch('/api' + path, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}
const GET  = (p)    => api('GET',   p);
const POST = (p, b) => api('POST',  p, b);
const PATCH= (p, b) => api('PATCH', p, b);

// ── Loading overlay ────────────────────────────────────────────────────────
function showLoading() {
  let el = document.getElementById('loading-overlay');
  if (!el) {
    el = document.createElement('div');
    el.id = 'loading-overlay';
    el.innerHTML = '<div class="spinner" style="width:36px;height:36px;border-width:3px"></div>';
    document.body.appendChild(el);
  }
  el.classList.remove('hidden');
}
function hideLoading() {
  const el = document.getElementById('loading-overlay');
  if (el) el.classList.add('hidden');
}

// ── Router ─────────────────────────────────────────────────────────────────
const routes = { '/': renderDashboard, '/sessions': renderSessions, '/sync': renderSync, '/backup': renderBackup };
function navigate(route) {
  location.hash = '#' + route;
}
function getRoute() {
  return location.hash.replace(/^#/, '') || '/';
}
async function renderRoute() {
  const route = getRoute();
  document.querySelectorAll('.nav-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.route === route);
  });
  const fn = routes[route] || renderDashboard;
  const main = document.getElementById('main');
  main.innerHTML = '<div style="padding:40px;text-align:center"><div class="spinner"></div></div>';
  try { await fn(main); } catch(e) { main.innerHTML = `<div class="card" style="color:var(--red)">Error: ${e.message}</div>`; }
}
window.addEventListener('hashchange', renderRoute);
document.querySelectorAll('.nav-tab').forEach(t => {
  t.addEventListener('click', () => navigate(t.dataset.route));
});

// ── Helpers ────────────────────────────────────────────────────────────────
function fmtDate(s) {
  if (!s) return '—';
  const d = new Date(s);
  return d.toLocaleDateString('zh-CN') + ' ' + d.toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'});
}
function fmtBytes(n) {
  if (!n) return '0 B';
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n/1024).toFixed(1) + ' KB';
  return (n/1048576).toFixed(1) + ' MB';
}
function el(tag, props={}, ...children) {
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(props)) {
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  children.flat().forEach(c => e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c));
  return e;
}

// ── SSE progress helper ────────────────────────────────────────────────────
function sseApply(url, body, { onStart, onProgress, onDone, onError, logEl, barEl }) {
  return new Promise((resolve) => {
    fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) })
      .then(r => {
        const reader = r.body.getReader();
        const dec = new TextDecoder();
        let buf = '';
        function pump() {
          reader.read().then(({ done, value }) => {
            if (done) { resolve(); return; }
            buf += dec.decode(value, { stream: true });
            const lines = buf.split('\n');
            buf = lines.pop();
            for (const line of lines) {
              if (!line.startsWith('data:')) continue;
              try {
                const ev = JSON.parse(line.slice(5).trim());
                if (logEl) {
                  const div = document.createElement('div');
                  div.className = ev.type === 'error' ? 'err' : ev.type === 'done' ? 'ok' : 'info';
                  div.textContent = JSON.stringify(ev);
                  logEl.appendChild(div);
                  logEl.scrollTop = logEl.scrollHeight;
                }
                if (ev.type === 'start' && onStart) onStart(ev);
                if (ev.type === 'progress' && onProgress) {
                  onProgress(ev);
                  if (barEl && ev.total) barEl.style.width = (ev.n / ev.total * 100) + '%';
                }
                if (ev.type === 'done') { if (onDone) onDone(ev); resolve(ev); }
                if (ev.type === 'error') { if (onError) onError(ev); resolve(null); }
              } catch {}
            }
            pump();
          });
        }
        pump();
      })
      .catch(e => { if (onError) onError({ message: e.message }); resolve(null); });
  });
}

// ══════════════════════════════════════════════════════════════════════════
// Page: Dashboard
// ══════════════════════════════════════════════════════════════════════════
async function renderDashboard(main) {
  const [health, sessData] = await Promise.all([
    GET('/health').catch(() => ({ ok: false, codex_running: null, version: '—' })),
    GET('/sessions').catch(() => ({ sessions: [], total: 0 })),
  ]);

  const sessions = sessData.sessions || [];
  const today = new Date().toISOString().slice(0, 10);
  const todaySessions = sessions.filter(s => s.updated_at && s.updated_at.slice(0,10) === today);
  const projects = [...new Set(sessions.map(s => s.project).filter(Boolean))];

  const codexStatus = health.codex_running === true ? ['dot dot-red','运行中']
    : health.codex_running === false ? ['dot dot-green','已停止']
    : ['dot dot-yellow','未知'];

  main.innerHTML = '';

  // status bar
  const statusBar = el('div', {class:'card flex items-center gap-12 mb-16', style:'padding:12px 20px'},
    el('span', {}, el('span', {class: codexStatus[0]}), `Codex: ${codexStatus[1]}`),
    el('span', {class:'text-muted'}, '|'),
    el('span', {class:'text-muted'}, `版本: ${health.version || '—'}`),
  );
  main.appendChild(statusBar);

  // stat tiles
  const statsGrid = el('div', {class:'grid grid-3 mb-16'});
  [
    ['总会话数', sessions.length, 'badge-blue'],
    ['今日会话', todaySessions.length, 'badge-green'],
    ['项目数',   projects.length,      'badge-yellow'],
  ].forEach(([lbl, val, badge]) => {
    statsGrid.appendChild(el('div', {class:'card'},
      el('div', {class:'stat-val'}, String(val)),
      el('div', {class:'stat-lbl'}, lbl),
    ));
  });
  main.appendChild(statsGrid);

  // quick actions
  const actions = el('div', {class:'card mb-16'});
  actions.appendChild(el('div', {class:'card-title'}, '快捷操作'));
  const btnRow = el('div', {class:'flex gap-8'});
  const btnSync = el('button', {class:'btn', onclick: () => navigate('/sync')}, '⚡ 开始同步');
  const btnBackup = el('button', {class:'btn btn-ghost', onclick: async () => {
    showLoading();
    try { await POST('/backup'); toast('备份创建成功', 'success'); }
    catch(e) { toast('备份失败: ' + e.message, 'error'); }
    finally { hideLoading(); }
  }}, '💾 立即备份');
  const btnSessions = el('button', {class:'btn btn-ghost', onclick: () => navigate('/sessions')}, '📋 会话管理');
  btnRow.append(btnSync, btnBackup, btnSessions);
  actions.appendChild(btnRow);
  main.appendChild(actions);

  // recent sessions
  const recent = sessions.slice().sort((a,b) => b.updated_at.localeCompare(a.updated_at)).slice(0,8);
  if (recent.length) {
    const card = el('div', {class:'card'});
    card.appendChild(el('div', {class:'card-title'}, '最近会话'));
    const tbl = el('table', {});
    tbl.appendChild(el('thead', {}, el('tr', {},
      el('th',{}, '名称'), el('th',{}, '项目'), el('th',{}, '最后更新')
    )));
    const tbody = el('tbody', {});
    recent.forEach(s => {
      tbody.appendChild(el('tr', {style:'cursor:pointer', onclick:()=>navigate('/sessions')},
        el('td',{}, s.thread_name || s.id),
        el('td',{}, el('span',{class:'badge badge-blue'}, s.project || '—')),
        el('td',{class:'text-muted'}, fmtDate(s.updated_at)),
      ));
    });
    tbl.appendChild(tbody);
    card.appendChild(tbl);
    main.appendChild(card);
  }
}

// ══════════════════════════════════════════════════════════════════════════
// Page: Sessions
// ══════════════════════════════════════════════════════════════════════════
async function renderSessions(main) {
  main.innerHTML = '';
  showLoading();
  let sessions = [];
  try { sessions = (await GET('/sessions')).sessions || []; }
  catch(e) { toast('加载会话失败: ' + e.message, 'error'); }
  finally { hideLoading(); }

  // group by project
  const byProject = {};
  sessions.forEach(s => {
    const p = s.project || '(unknown)';
    (byProject[p] = byProject[p] || []).push(s);
  });
  const projects = Object.keys(byProject).sort();

  let activeProject = projects[0] || null;
  let searchTerm = '';

  const layout = el('div', {class:'sidebar-layout'});

  // sidebar
  const sidebar = el('div', {class:'sidebar'});
  function buildSidebar() {
    sidebar.innerHTML = '';
    sidebar.appendChild(el('div', {class:'sidebar-section'}, `项目 (${projects.length})`));
    projects.forEach(p => {
      const item = el('div', {class:'sidebar-item' + (p === activeProject ? ' active' : ''),
        onclick: () => { activeProject = p; buildSidebar(); buildTable(); }},
        p, el('span', {class:'text-muted', style:'float:right;font-size:11px'}, String(byProject[p].length))
      );
      sidebar.appendChild(item);
    });
  }

  // content
  const pane = el('div', {class:'content-pane'});
  function buildTable() {
    pane.innerHTML = '';
    const list = activeProject ? (byProject[activeProject] || []) : sessions;
    const filtered = searchTerm
      ? list.filter(s => (s.thread_name||'').toLowerCase().includes(searchTerm) || (s.id||'').includes(searchTerm))
      : list;

    // header
    const hdr = el('div', {class:'flex items-center gap-8 mb-16'});
    const searchInput = el('input', {type:'text', placeholder:'搜索会话名称…', style:'max-width:280px',
      oninput: e => { searchTerm = e.target.value.toLowerCase(); buildTable(); }});
    searchInput.value = searchTerm;
    hdr.appendChild(searchInput);
    hdr.appendChild(el('span', {class:'text-muted text-sm'}, `${filtered.length} 条`));
    pane.appendChild(hdr);

    if (!filtered.length) {
      pane.appendChild(el('div', {class:'text-muted', style:'padding:32px;text-align:center'}, '暂无会话'));
      return;
    }

    const tbl = el('table',{});
    tbl.appendChild(el('thead',{},el('tr',{},
      el('th',{},'会话名称'),el('th',{},'ID'),el('th',{},'最后更新'),el('th',{},'操作')
    )));
    const tbody = el('tbody',{});
    filtered.sort((a,b)=>b.updated_at.localeCompare(a.updated_at)).forEach(s => {
      let editing = false;
      const nameCell = el('td',{}, s.thread_name || s.id);

      function startEdit() {
        if (editing) return;
        editing = true;
        nameCell.innerHTML = '';
        const inp = el('input', {type:'text', style:'width:100%', value: s.thread_name || ''});
        nameCell.appendChild(inp);
        inp.focus(); inp.select();
        inp.onblur = async () => {
          const val = inp.value.trim();
          if (val && val !== s.thread_name) {
            try {
              await PATCH('/sessions/' + s.id, { thread_name: val });
              s.thread_name = val;
              toast('重命名成功', 'success');
            } catch(e) { toast('重命名失败: ' + e.message, 'error'); }
          }
          editing = false;
          buildTable();
        };
        inp.onkeydown = e => { if (e.key === 'Enter') inp.blur(); if (e.key === 'Escape') { editing=false; buildTable(); } };
      }

      nameCell.style.cursor = 'text';
      nameCell.ondblclick = startEdit;

      const delBtn = el('button',{class:'btn btn-danger btn-sm', onclick: async () => {
        if (!confirm(`确定删除会话「${s.thread_name || s.id}」吗？\n\n· 需要先关闭 Codex\n· 将同时删除会话文件、索引条目和数据库记录\n· 此操作不可撤销（建议先创建备份）`)) return;
        delBtn.disabled = true;
        try {
          await api('DELETE', '/sessions/' + s.id);
          toast('会话已删除', 'success');
          // 从本地数据源移除并重建视图
          const arr = byProject[s.project || '(unknown)'];
          if (arr) {
            const i = arr.indexOf(s);
            if (i !== -1) arr.splice(i, 1);
          }
          buildTable(); buildSidebar();
        } catch(e) {
          toast('删除失败: ' + e.message, 'error');
          delBtn.disabled = false;
        }
      }}, '🗑 删除');

      const row = el('tr',{},
        nameCell,
        el('td',{class:'text-muted text-sm'}, s.id.slice(0,8)+'…'),
        el('td',{class:'text-muted'}, fmtDate(s.updated_at)),
        el('td',{}, el('div',{class:'flex gap-8'},
          el('button',{class:'btn btn-ghost btn-sm', onclick:startEdit}, '✏️ 重命名'),
          delBtn)),
      );
      tbody.appendChild(row);
    });
    tbl.appendChild(tbody);
    pane.appendChild(tbl);
  }

  buildSidebar();
  buildTable();
  layout.append(sidebar, pane);
  main.appendChild(layout);
}

// ══════════════════════════════════════════════════════════════════════════
// Page: Sync
// ══════════════════════════════════════════════════════════════════════════
async function renderSync(main) {
  main.innerHTML = '';

  // WebDAV status card
  const davCard = el('div', {class:'card mb-16'});
  davCard.appendChild(el('div', {class:'card-title'}, 'WebDAV 连接'));

  const statusRow = el('div', {class:'flex items-center gap-8 mb-12'});
  const statusDot = el('span', {class:'dot dot-yellow'});
  const statusText = el('span', {}, '检测中…');
  statusRow.append(statusDot, statusText);

  // WebDAV config form
  const form = el('div', {class:'grid mb-12', style:'grid-template-columns:1fr 1fr;gap:12px'});
  const urlIn  = el('input',{type:'text', placeholder:'https://your-server/remote.php/dav/files/user'});
  const userIn = el('input',{type:'text', placeholder:'用户名'});
  const passIn = el('input',{type:'password', placeholder:'密码'});
  const pathIn = el('input',{type:'text', placeholder:'/codex-sync'});

  // load current config
  GET('/config').then(cfg => {
    const w = cfg.webdav || {};
    urlIn.value  = w.url || '';
    userIn.value = w.username || '';
    pathIn.value = w.remote_path || '/codex-sync';
  }).catch(()=>{});

  form.append(
    el('div',{}, el('label',{},'WebDAV URL'), urlIn),
    el('div',{}, el('label',{},'用户名'), userIn),
    el('div',{}, el('label',{},'密码'), passIn),
    el('div',{}, el('label',{},'远端路径'), pathIn),
  );

  const testBtn = el('button',{class:'btn btn-ghost btn-sm', style:'margin-top:20px', onclick: async () => {
    testBtn.disabled = true; testBtn.textContent = '测试中…';
    statusDot.className = 'dot dot-yellow';
    statusText.textContent = '连接中…';
    try {
      const r = await POST('/config/webdav/test', {
        url: urlIn.value, username: userIn.value, password: passIn.value, remote_path: pathIn.value
      });
      if (r.ok) {
        statusDot.className = 'dot dot-green';
        statusText.textContent = `已连接 (${r.latency_ms}ms)`;
        toast('WebDAV 连接成功', 'success');
      } else {
        statusDot.className = 'dot dot-red';
        statusText.textContent = '连接失败: ' + (r.error || '未知');
        toast('WebDAV 连接失败: ' + r.error, 'error');
      }
    } catch(e) {
      statusDot.className = 'dot dot-red'; statusText.textContent = e.message;
      toast(e.message, 'error');
    } finally { testBtn.disabled=false; testBtn.textContent='测试连接'; }
  }}, '测试连接');

  davCard.append(statusRow, form, testBtn);
  main.appendChild(davCard);

  // Plan + Sync card
  const syncCard = el('div', {class:'card'});
  syncCard.appendChild(el('div', {class:'card-title'}, '同步操作'));

  const planArea = el('div', {class:'mt-8', style:'display:none'});
  const planBtn = el('button', {class:'btn btn-ghost', onclick: async () => {
    planBtn.disabled=true; planBtn.textContent='计划中…';
    try {
      const { plan } = await POST('/sync/plan');
      planArea.style.display = '';
      planArea.innerHTML = '';
      const summary = [
        ['待上传', plan.to_upload.length, 'badge-blue'],
        ['待下载', plan.to_download.length, 'badge-green'],
        ['冲突', plan.conflicts.length, 'badge-red'],
        ['未变化', plan.unchanged.length, 'badge-yellow'],
      ];
      const row = el('div',{class:'flex gap-8 mb-12'});
      summary.forEach(([lbl,n,cls])=>{
        row.appendChild(el('span',{class:'badge '+cls}, `${lbl}: ${n}`));
      });
      planArea.appendChild(row);

      if (plan.to_upload.length) {
        planArea.appendChild(el('div',{class:'text-muted text-sm mb-4'},'上传:'));
        plan.to_upload.slice(0,10).forEach(f => planArea.appendChild(el('div',{class:'text-sm',style:'padding:2px 0'},`↑ ${f}`)));
        if(plan.to_upload.length>10) planArea.appendChild(el('div',{class:'text-muted text-sm'},`…还有 ${plan.to_upload.length-10} 个`));
      }
      if (plan.to_download.length) {
        planArea.appendChild(el('div',{class:'text-muted text-sm mb-4 mt-8'},'下载:'));
        plan.to_download.slice(0,10).forEach(f => planArea.appendChild(el('div',{class:'text-sm',style:'padding:2px 0'},`↓ ${f}`)));
      }
      if (plan.conflicts.length) {
        planArea.appendChild(el('div',{class:'text-muted text-sm mb-4 mt-8',style:'color:var(--red)'},'冲突:'));
        plan.conflicts.forEach(c => planArea.appendChild(el('div',{class:'text-sm',style:'color:var(--red)'},`⚠ ${c.rel || c}`)));
      }
    } catch(e) { toast('构建计划失败: '+e.message,'error'); }
    finally { planBtn.disabled=false; planBtn.textContent='预览计划'; }
  }}, '预览计划');

  const progressWrap = el('div',{class:'mt-12',style:'display:none'});
  const barWrap = el('div',{class:'progress-wrap'});
  const bar = el('div',{class:'progress-bar',style:'width:0%'});
  barWrap.appendChild(bar);
  const logEl = el('div',{class:'log-stream mt-8'});
  const summary = el('div',{class:'mt-8 text-sm'});
  progressWrap.append(barWrap, logEl, summary);

  const applyBtn = el('button', {class:'btn', onclick: async () => {
    applyBtn.disabled=true; applyBtn.textContent='同步中…';
    progressWrap.style.display=''; logEl.innerHTML=''; bar.style.width='0%'; summary.textContent='';
    const result = await sseApply('/api/sync/apply', {}, {
      logEl, barEl: bar,
      onDone: r => {
        summary.innerHTML = `<span class="badge badge-green">完成</span> 上传 ${r.uploaded} 下载 ${r.downloaded} 跳过 ${r.skipped} 错误 ${r.errors}`;
        toast('同步完成','success');
      },
      onError: e => { toast('同步失败: '+(e.message||''),'error'); }
    });
    applyBtn.disabled=false; applyBtn.textContent='开始同步';
  }}, '⚡ 开始同步');

  const btnRow = el('div',{class:'flex gap-8 mt-12'});
  btnRow.append(planBtn, applyBtn);
  syncCard.append(btnRow, planArea, progressWrap);
  main.appendChild(syncCard);
}

// ══════════════════════════════════════════════════════════════════════════
// Page: Backup & Restore
// ══════════════════════════════════════════════════════════════════════════
async function renderBackup(main) {
  main.innerHTML = '';

  // action bar
  const topBar = el('div',{class:'card mb-16'});
  topBar.appendChild(el('div',{class:'card-title'},'备份管理'));
  const createBtn = el('button',{class:'btn', onclick: async () => {
    createBtn.disabled=true; createBtn.textContent='备份中…';
    try {
      const r = await POST('/backup');
      toast(`备份创建: ${r.name}`, 'success');
      renderBackup(main);
    } catch(e) { toast('备份失败: '+e.message,'error'); }
    finally { createBtn.disabled=false; createBtn.textContent='💾 立即备份'; }
  }}, '💾 立即备份');
  topBar.appendChild(createBtn);
  main.appendChild(topBar);

  // list card
  const listCard = el('div',{class:'card mb-16'});
  listCard.appendChild(el('div',{class:'card-title'},'备份列表'));
  showLoading();
  let backups = [], backupDir = '';
  try {
    const r = await GET('/backups');
    backups = r.backups || [];
    backupDir = r.backup_dir || '';
  }
  catch(e) { toast('加载备份失败: '+e.message,'error'); }
  finally { hideLoading(); }

  // 显示快照存储路径
  if (backupDir) {
    listCard.appendChild(el('div',{class:'text-muted text-sm mb-8'}, `存储位置: ${backupDir}`));
  }

  if (!backups.length) {
    listCard.appendChild(el('div',{class:'text-muted',style:'padding:24px;text-align:center'},'暂无备份'));
  } else {
    const tbl = el('table',{});
    tbl.appendChild(el('thead',{},el('tr',{},
      el('th',{},'快照名称'),el('th',{},'创建时间'),el('th',{},'大小'),el('th',{},'格式'),el('th',{},'操作')
    )));
    const tbody = el('tbody',{});
    backups.sort((a,b)=>b.created_at.localeCompare(a.created_at)).forEach(b => {
      const restoreBtn = el('button',{class:'btn btn-ghost btn-sm', onclick: () => startRestore(b.name, progressArea, bar, logEl, summaryEl)}, '恢复');
      const deleteBtn = el('button',{class:'btn btn-danger btn-sm', onclick: async () => {
        if (!confirm(`确定删除快照 ${b.name} 吗？此操作不可撤销。`)) return;
        deleteBtn.disabled = true;
        try {
          await api('DELETE', '/backups/' + encodeURIComponent(b.name));
          toast('快照已删除', 'success');
          renderBackup(main);
        } catch(e) {
          toast('删除失败: ' + e.message, 'error');
          deleteBtn.disabled = false;
        }
      }}, '删除');
      tbody.appendChild(el('tr',{},
        el('td',{}, b.name),
        el('td',{class:'text-muted'}, fmtDate(b.created_at)),
        el('td',{class:'text-muted'}, fmtBytes(b.size_bytes)),
        el('td',{}, el('span',{class:'badge badge-blue'}, b.format||'none')),
        el('td',{}, el('div',{class:'flex gap-8'}, restoreBtn, deleteBtn)),
      ));
    });
    tbl.appendChild(tbody);
    listCard.appendChild(tbl);
  }
  main.appendChild(listCard);

  // ── provider merge card ──────────────────────────────────────────────────
  const mergeCard = el('div',{class:'card mb-16'});
  mergeCard.appendChild(el('div',{class:'card-title'},'会话合并（登录方式隔离）'));
  mergeCard.appendChild(el('div',{class:'text-muted text-sm mb-12'},
    'Codex 按登录方式隔离会话列表：openai = ChatGPT 页面授权登录，custom = API key 登录。可将一方的会话合并到另一方，使其在同一列表中可见。'));

  const provTable = el('div',{class:'mb-12'});
  const fromSel = el('select',{style:'max-width:180px'});
  const toSel = el('select',{style:'max-width:180px'});

  async function loadProviders() {
    provTable.innerHTML = '';
    fromSel.innerHTML = ''; toSel.innerHTML = '';
    try {
      const { providers = [] } = await GET('/providers');
      if (!providers.length) {
        provTable.appendChild(el('div',{class:'text-muted text-sm'},'未发现任何会话'));
        return;
      }
      const tbl = el('table',{});
      tbl.appendChild(el('thead',{},el('tr',{},
        el('th',{},'登录方式 (provider)'),el('th',{},'会话文件数'),el('th',{},'数据库线程数')
      )));
      const tbody = el('tbody',{});
      providers.forEach(p => {
        tbody.appendChild(el('tr',{},
          el('td',{}, el('span',{class:'badge '+(p.provider==='openai'?'badge-green':'badge-blue')}, p.provider)),
          el('td',{class:'text-muted'}, String(p.rollout_count)),
          el('td',{class:'text-muted'}, String(p.db_count)),
        ));
        fromSel.appendChild(el('option',{value:p.provider}, p.provider));
        toSel.appendChild(el('option',{value:p.provider}, p.provider));
      });
      // 默认 from=openai → to=custom（常见方向）
      if (providers.some(p=>p.provider==='openai')) fromSel.value='openai';
      if (providers.some(p=>p.provider==='custom')) toSel.value='custom';
      tbl.appendChild(tbody);
      provTable.appendChild(tbl);
    } catch(e) {
      provTable.appendChild(el('div',{class:'text-sm',style:'color:var(--red)'},'加载失败: '+e.message));
      toast('加载 provider 失败: '+e.message,'error');
    }
  }
  loadProviders();

  const mergeResult = el('div',{class:'text-sm mt-8'});
  const previewBtn = el('button',{class:'btn btn-ghost btn-sm', onclick: async () => {
    try {
      const r = await POST('/merge', { from: fromSel.value, to: toSel.value, dry_run: true });
      mergeResult.innerHTML = `<span class="badge badge-yellow">预览</span> ${r.from} → ${r.to}：会话文件 ${r.rollouts_changed} 个，数据库线程 ${r.db_rows_changed} 条`;
    } catch(e) { toast('预览失败: '+e.message,'error'); }
  }}, '预览合并');

  const mergeBtn = el('button',{class:'btn btn-sm', onclick: async () => {
    if (fromSel.value === toSel.value) { toast('源和目标不能相同','error'); return; }
    if (!confirm(`确定将 ${fromSel.value} 的所有会话合并到 ${toSel.value} 吗？\n\n· 需要先关闭 Codex\n· 合并前会自动创建备份快照\n· 会改写会话文件和数据库`)) return;
    mergeBtn.disabled = true; mergeBtn.textContent = '合并中…';
    try {
      const r = await POST('/merge', { from: fromSel.value, to: toSel.value, dry_run: false });
      mergeResult.innerHTML = `<span class="badge badge-green">已合并</span> 会话文件 ${r.rollouts_changed} 个，数据库线程 ${r.db_rows_changed} 条（已自动备份）`;
      toast('合并完成','success');
      loadProviders();
    } catch(e) { toast('合并失败: '+e.message,'error'); }
    finally { mergeBtn.disabled=false; mergeBtn.textContent='执行合并'; }
  }}, '执行合并');

  const mergeRow = el('div',{class:'flex items-center gap-8'},
    el('span',{class:'text-sm text-muted'},'将'), fromSel,
    el('span',{class:'text-sm text-muted'},'合并到'), toSel,
    previewBtn, mergeBtn);
  mergeCard.append(provTable, mergeRow, mergeResult);
  main.appendChild(mergeCard);

  // restore progress card
  const restoreCard = el('div',{class:'card',style:'display:none'});
  restoreCard.appendChild(el('div',{class:'card-title'},'恢复进度'));
  const progressArea = restoreCard;
  const barWrap = el('div',{class:'progress-wrap'});
  const bar = el('div',{class:'progress-bar',style:'width:0%'});
  barWrap.appendChild(bar);
  const logEl = el('div',{class:'log-stream mt-8'});
  const summaryEl = el('div',{class:'mt-8 text-sm'});
  restoreCard.append(barWrap, logEl, summaryEl);
  main.appendChild(restoreCard);

  async function startRestore(snapshot, card, barEl, logEl, summaryEl) {
    card.style.display='';
    logEl.innerHTML=''; barEl.style.width='0%'; summaryEl.textContent='';
    await sseApply('/api/restore', { snapshot, target:'local' }, {
      logEl, barEl,
      onDone: r => {
        summaryEl.innerHTML = `<span class="badge badge-green">恢复完成</span> 快照: ${r.snapshot}`;
        toast('恢复成功','success');
      },
      onError: e => { toast('恢复失败: '+(e.message||''),'error'); }
    });
  }
}

// ── Init ───────────────────────────────────────────────────────────────────
renderRoute();
</script>
